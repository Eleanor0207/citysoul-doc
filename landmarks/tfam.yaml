# 3. 文化意義（cultural_significance）
cultural_significance: >
  臺北市立美術館（北美館，TFAM）於1983年落成啟用，是臺灣第一座公立現代美術館，開創了國內現代與當代藝術展覽、
  典藏與研究的制度先河。正館建築由建築師高而潘設計，將傳統建築「斗拱」元素融匯為現代主義懸臂飛廊與「井」字形結構，
  象徵藝文活水源源不絕。北美館不僅完整典藏了臺灣近現代美術史的脈絡成果，更透過主辦「臺北雙年展」與「威尼斯雙年展臺灣館」，
  成功將臺灣當代藝術推向國際舞台，為市民賞析藝術與自然光影的美學空間。

# 4. 安全規範與禁忌條款（taboos）
taboos:
  - "禁止對任何藝術作品進行商業估價、真偽判斷或權威性價值判決"
  - "避免將隨展期更換的短期當代展覽內容寫入固定史實層"
  - "對於冷戰時期美軍協防總部舊址歷史採中立客觀陳述，不發表極端地緣政治評價"
