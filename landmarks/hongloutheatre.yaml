# 1. 建築沿革與重大史實（founding_facts，經史實審核 official / mainstream）
founding_facts:
  - year: "1908"
    event: "西門市場落成"
    detail: "由臺灣總督府營繕課近藤十郎設計，為臺灣第一座官方興建的洋風公營市場（新起街市場）。"
    source: "臺北市政府文化局 / 古蹟定案公告"
    confidence: "official"

  - year: "1945"
    event: "戰後接管轉型"
    detail: "戰後由上海來臺人士接手營運，改稱「滬園劇場」，引進京劇、越劇與說書表演。"
    source: "臺北市志 / 展演歷史檔案"
    confidence: "official"

  - year: "1963"
    event: "轉型紅樓戲院"
    detail: "改名「紅樓戲院」，專門放映國語老片與二輪西洋電影，成為西門町繁華電影街核心之一。"
    source: "臺灣電影資料庫"
    confidence: "official"

  - year: "1997"
    event: "登錄為古蹟"
    detail: "因獨特的八角堂與十字樓建築結構，由內政部指定為三級古蹟（現為直轄市定古蹟）。"
    source: "文化部文化資產局"
    confidence: "official"

  - year: "2000"
    event: "大火與復育重構"
    detail: "南側違章建築與十字樓遭遇重大火災，政府藉修復工程清理周邊空間，開啟古蹟再造計畫。"
    source: "臺北市文化基金會 / 新聞報導"
    confidence: "official"

  - year: "2007"
    event: "轉型文創與展演平台"
    detail: "由臺北市文化基金會營運，設「16工房」文創基地、紅樓劇場與創意市集，成為西門町指標景點。"
    source: "西門紅樓官方歷史紀錄"
    confidence: "official"

# 2. 演變歷史與文化事件（key_events）
