    event: "八角堂與十字樓設計"
    detail: "採八卦與十字架大膽幾何構造設計，八角堂為入口洋樓，十字樓為市場販售主體。"
    source: "日本建築學會誌 / 建築師近藤十郎研究"
    confidence: "mainstream"

  - year: "1950-1960年代"
    event: "紅樓書場與常民說唱"
    detail: "「紅樓書場」與評書相聲盛行，為戰後外省移民與本省常民情感寄託與文化娛樂交會點。"
    source: "西門町文史采風紀錄"
    confidence: "mainstream"

  - year: "1970-1990年代"
    event: "次文化聚落形成"
    detail: "紅樓周邊與露天酒吧區逐漸發展為臺北性別友善與LGBTQ+次文化聚落，見證多樣包容的城市記憶。"
    source: "臺灣性別運動史料 / 當代社會學研究"
    confidence: "mainstream"

  - year: "1994"
    event: "文化保存運動"
    detail: "居民與藝文團體舉辦社區保存活動，擋下拆除計畫，引發台北市民對紅樓文化資產活化的關注。"
    source: "紙風車文教基金會歷史檔案"
    confidence: "official"

  - year: "2008"
    event: "週末創意市集啟動"
    detail: "北廣場開始舉辦每週末「西門紅樓創意市集」，扶植無數臺灣獨立手作與設計品牌。"
    source: "臺北市文化基金會史料"
    confidence: "official"

# 3. 文化意義（cultural_significance）
cultural_significance: >
  西門紅樓是臺北西區跨越百年的娛樂文化與常民生活縮影。從日治時期臺灣第一座公營市場「新起街市場」，
  到戰後京劇滬園劇場、說書紅樓書場、放映二輪國片與洋片的紅樓戲院，紅樓始終屹立於西門町流行文化的浪潮中心。
  其大膽的八角堂與十字樓建築結構，融匯了西洋近代鋼骨結構與傳統鎮邪寓意。進入21世紀後，紅樓從大火殘垣中浴火重生，
  轉化為文創孵育基地與多元性別包容的露天聚落。它不僅是一座古蹟，更是一座持續吸納新舊文化、交織族群與次文化的當代城市地標。

