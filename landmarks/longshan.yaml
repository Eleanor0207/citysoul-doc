# 3. 文化意義（cultural_significance）
cultural_significance: >
  艋舺龍山寺始建於1738年，為臺北三大古廟之一，也是艋舺三邑移民的信仰與自治中心。
  其建築風格集清代與日治大改建時期木雕、石雕、彩繪與剪黏藝術之大成，大雄寶殿前之銅鑄螺旋藻井尤為珍貴。
  龍山寺不僅供奉觀世音菩薩，後殿亦合祀媽祖、關聖帝君、文昌帝君與月老等多神信仰，展現台灣庶民社會極高的包容性。
  歷經地震、颱風與1945年臺北大空襲洗禮，大殿雖毀而觀音聖像屹立不搖，成為艋舺乃至全臺北市心靈寄託與歷史記憶之核心。

