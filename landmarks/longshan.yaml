# 1. 建築沿革與重大史實（founding_facts）
founding_facts:
  - year: "1738 (清乾隆三年)"
    event: "初始建廟"
    detail: "泉州晉江、惠安、南安三邑移民自安溪分靈觀音菩薩，合資於艋舺現址興建龍山寺。"
    source: "文化部文化資產局 / 廟誌"
    confidence: "official"

  - year: "1815 (清嘉慶二十年)"
    event: "大地震重修"
    detail: "艋舺發生強烈大地震，龍山寺嚴重毀損，後由地方紳商號召募資重新修建。"
    source: "龍山寺官方沿革"
    confidence: "official"

  - year: "1867 (清同治六年)"
    event: "暴風雨重修"
    detail: "遭逢暴風雨侵襲，棟樑再度毀損，由地方人士募款進行第三次重大修建。"
    source: "文化部文化資產局"
    confidence: "official"

  - year: "1919 (日治大正八年)"
    event: "住持發起大改建"
    detail: "住持福智大師捐積蓄並募資，聘名匠辜婦蠢、王益順進行大改建，奠定今日木雕與藻井藝術基礎。"
    source: "龍山寺沿革簡介"
    confidence: "official"

  - year: "1945 (日治昭和二十年)"
    event: "臺北大空襲毀損與戰後重建"
    detail: "5月31日盟軍空襲臺北，大雄寶殿全毀，僅觀音佛像屹立於廢墟中，後於戰後發起重建。"
    source: "臺灣歷史辭典 / 龍山寺志"
    confidence: "official"

  - year: "2018"
    event: "升格國定古蹟"
    detail: "文化部公告升格為國定古蹟，指定範圍包含山門、廟埕、三川殿、正殿、後殿與東西護龍。"
    source: "文化部文化資產局"
    confidence: "official"

