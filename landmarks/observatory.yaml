    detail: "哈雷彗星回歸期間，圓山天文臺吸引數以萬計民眾排隊夜觀彗星，創下常民科普觀測紀錄。"
    source: "新聞報導 / 天文館歷史照片"
    confidence: "official"

  - year: "2001"
    event: "NASA 月岩展（2001年）"
    detail: "引進 NASA 阿波羅計畫月球岩石標本特展，引發全國天文科普與太空熱潮。"
