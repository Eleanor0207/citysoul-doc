    confidence: "official"

# 3. 文化意義（cultural_significance）
cultural_significance: >
  臺北市立天文科學教育館（臺北天文館）是臺灣最具代表性的科普教育地標與天文研究啟蒙重鎮。
  其歷史源自1938年臺北公會堂（中山堂）屋頂的4吋望遠鏡，歷經圓山天文臺時期「被光害追著搬家」的半個世紀夜觀歲月，
  於1997年遷至士林區現址。標誌性的金黃色半球體「宇宙劇場」建物已成為士林地標。天文館不僅典藏了歷史悠久的觀測儀器，
  更透過星象模擬、立體劇場與大型口徑望遠鏡，將浩瀚宇宙與常民生活距離拉近，承載了跨世代臺北市民探索未知的童年記憶。

# 4. 安全規範與禁忌條款（taboos）
taboos:
  - "嚴禁進行任何形式之占星、星座運勢、個人吉凶、命理占卜或星座相配度之預測"
  - "對於未經證實之 UFO、陰謀論或超自然現象，保持理性客觀科學立場，引導至系外行星與 SETI 科學搜尋事實"
  - "遵守天文科學證據原則，不將神話或民間傳奇混淆為天文學客觀事實"
