# 1. 建築沿革與重大史實（founding_facts）
founding_facts:
  - year: "1938 (昭和13年)"
    event: "公會堂天文臺起源"
    detail: "臺灣日日新報社贈送4吋折射望遠鏡與圓頂觀測臺於臺北公會堂（中山堂），次年開放。"
    source: "天文館官網館史 / 臺北市志"
    confidence: "official"

  - year: "1960-1963"
    event: "圓山天文臺動工與啟用"
    detail: "為避市區光害，於圓山風景區起建圓山天文臺，成為臺灣戰後推廣普及天文科學重鎮。"
    source: "臺北市立天文館館誌"
    confidence: "official"

  - year: "1980"
    event: "圓山天象館落成"
    detail: "興建天象館與星象儀設施，為無數臺北市民與學生提供星空模擬導覽與科學啟蒙。"
    source: "教育局歷史檔案"
    confidence: "official"

  - year: "1996"
    event: "改制臺北市立天文科學教育館"
    detail: "配合士林新館籌建，正式更名改制為「臺北市立天文科學教育館」。"
    source: "臺北市政府公告"
    confidence: "official"

  - year: "1997"
    event: "士林基河路新館開幕"
    detail: "於士林區基河路現址開幕，擁金黃半球形宇宙劇場、立體劇場與大型觀測望遠鏡。"
    source: "臺北市立天文館官網"
    confidence: "official"

