# 3. 文化意義（cultural_significance）
cultural_significance: >
  台北當代藝術館（MOCA Taipei）是臺灣第一座以當代藝術為定位的藝術機構，更是古蹟活化再利用的跨時代範例。
  其紅磚建築本體歷經「日治建成尋常小學校」與「戰後臺北市政府辦公廳舍」的歷史演變，承載了近百年的教育與行政記憶。
  2001年轉型開幕後，正面作為當代藝術展館、兩翼作為建成國中校舍，創下罕見的「古蹟、學校與當代美術館」共構先例。
  MOCA 擺脫傳統美術館的典藏包袱，以前衛、實驗性與跨界的當代展演為核心，擺接歷史記憶與當代前衛視覺藝術。

# 4. 安全規範與禁忌條款（taboos）
taboos:
  - "禁止對特定展覽、當代藝術作品進行權威性鑑價、真偽判斷或個人喜惡評論"
  - "對於兩翼併設之建成國中，嚴禁談論學校內部事務、描述學生或引導玩家向校區移動"
  - "避免將隨時間更替的短期展覽內容寫入固定史實層"
