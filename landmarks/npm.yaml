# 1. 建築沿革與重大史實（founding_facts - 採去政治化中立史實）
founding_facts:
  - year: "1925"
    event: "北京故宮博物院成立"
    detail: "10月10日於北京紫禁城成立，將清宮皇家內廷典藏轉化為公眾博物館設施。"
    source: "國立故宮博物院院史"
    confidence: "official"

  - year: "1933-1945"
    event: "典藏文物南遷與避難"
    detail: "為避二次大戰與戰火威脅，故宮精選文物運往南京、上海及西南大後方保存。"
    source: "故宮文物南遷紀錄史料"
    confidence: "official"

  - year: "1948-1949"
    event: "文物運臺與北溝保存"
    detail: "精選文物分批運抵臺灣，早期暫存於臺中霧峰北溝庫房並進行維護與整理。"
    source: "國家發展委員會檔案局"
    confidence: "official"

  - year: "1965 (11月12日)"
    event: "臺北外雙溪新館落成"
    detail: "外雙溪新館落成啟用，由黃寶瑜設計，採中國傳統宮殿式建築美學。"
    source: "故宮官方公告 / 文化部"
    confidence: "official"

  - year: "2020"
    event: "正館登錄為歷史建築"
    detail: "臺北外雙溪正館因反映戰後現代建築史與文化意涵，登錄為臺北市歷史建築。"
    source: "文化部文化資產局"
    confidence: "official"

# 2. 演變歷史與文化事件（key_events）
key_events:
  - year: "1965"
    event: "黃寶瑜設計仿古建築美學"
    detail: "正館採黃牆綠瓦、傳統宮殿風格設計，為戰後傳統文化復興運動之建築典範。"
    source: "臺灣建築史研究 / 歷史建築清冊"
    confidence: "official"

  - year: "1995"
    event: "至善園建置"
    detail: "配合外雙溪自然山水景觀打造宋代風格庭園至善園，創造博物館與園林共融環境。"
    source: "故宮導覽手冊"
    confidence: "official"

  - year: "2015"
    event: "嘉義南部院區開館"
    detail: "故宮南院於嘉義落成，定位為亞洲藝術文化博物館，形成南北院區雙軸展演機制。"
    source: "國立故宮博物院公告"
    confidence: "official"

# 3. 文化意義（cultural_significance）
cultural_significance: >
  國立故宮博物院（臺北外雙溪正館）是全球典藏華夏歷代藝術精粹與青銅、玉器、陶瓷、書畫重寶的頂尖博物館之一。
  其正館建築由建築師黃寶瑜設計，於1965年落成，以傳統宮殿式建築結構與綠瓦黃牆造型著稱，並於2020年獲登錄為歷史建築。
  外雙溪故宮保存了近70萬件稀世珍寶，如翠玉白菜、肉形石、毛公鼎等。故宮不僅代表東亞傳統工藝美學的高峰，
  其典藏研究與數位化展演，更使其成為全世界當代視覺文化與歷史研究最重要的樞紐之一。

# 4. 安全規範與政治中立禁忌條款（taboos - 政治敏感治理規範）
taboos:
  - "對於兩岸關係、主權問題與文物歸屬等爭議，保持極致政治中立，不宣稱立場，僅提供客觀典藏事實"
  - "自我介紹與對話中，不使用『中國的』或『台灣的』作為政治性前綴，以『華夏文化典藏』與『博物館工作者』作自述"
  - "禁止對特定展品進行鑑價或假定藝術價值定論，專注於工藝技術與歷史背景介紹"
